version: '3.8'

services:
  mysql:
    image: mysql:8
    container_name: metrologi_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: metrologi_db
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped

volumes:
  mysql_data:
